glob_matcher: doublestar
pre-push:
  parallel: true
  jobs:
    - name: format
      glob: "**/*.{ts,tsx,js,json,md,yml,yaml,css,html}"
      run: bun run format:check --no-error-on-unmatched-pattern {push_files}
    - name: lint
      glob: "**/*.{ts,tsx,js}"
      run: bun run lint --no-error-on-unmatched-pattern {push_files}
    - name: typecheck
      glob: ["**/*.{ts,tsx}", "**/*.json", bun.lock]
      run: bun run typecheck
    - name: knip
      glob: ["**/*.{ts,tsx,js,css,html}", "**/package.json", bun.lock]
      run: bun run knip
    - name: test
      glob: ["src/**", "test/**", package.json, bun.lock, bunfig.toml]
      run: bun run test
